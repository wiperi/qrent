services:
  scraper:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: qrent-scraper
    restart: unless-stopped
    environment:
      - TZ=Australia/Sydney
      - DB_HOST=${DB_HOST}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_DATABASE=${DB_DATABASE}
      - DB_PORT=${DB_PORT}
      - NSW_TRANSPORT_API_KEY=${NSW_TRANSPORT_API_KEY}
      - PROPERTY_RATING_API_KEY=${PROPERTY_RATING_API_KEY}
      - GOOGLE_MAPS_API_KEY=${GOOGLE_MAPS_API_KEY}
    volumes:
      - ./logs:/app/logs
      - ./data:/app/data
      - /tmp:/tmp
    shm_size: 2gb
    mem_limit: 3g
    networks:
      - qrent-network

networks:
  qrent-network:
    external: true
    name: qrent_qrent-network
