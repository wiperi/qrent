version: '3.8'

services:
  scraper-vnc:
    build:
      context: .
      dockerfile: Dockerfile.vnc
    container_name: qrent-scraper-vnc
    
    # 内存限制
    deploy:
      resources:
        limits:
          memory: 3G
        reservations:
          memory: 1G
    
    environment:
      - PYTHONUNBUFFERED=1
      - DISPLAY=:99
    
    # 挂载目录
    volumes:
      - ./output:/app/output
      - ./logs:/app/logs
      # 挂载 profile 目录 - 验证后会保存在这里
      - ./docker_rea_profile:/app/rea_profile
      - ./docker_domain_profile:/app/domain_profile
    
    # 端口映射 - noVNC
    ports:
      - "6080:6080"
    
    # 共享内存
    shm_size: '2gb'
    
    security_opt:
      - seccomp:unconfined
    
    # 保持容器运行
    stdin_open: true
    tty: true

