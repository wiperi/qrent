name: CD

on:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: deployment-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      !cancelled() &&
      github.repository == 'wiperi/qrent' &&
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/staging')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: ${{ github.ref == 'refs/heads/main' && 'production' || 'staging' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Package only tracked backend sources
        run: |
          git archive --format=tar.gz --output="backend-${GITHUB_SHA}.tgz" HEAD \
            package.json pnpm-lock.yaml pnpm-workspace.yaml .dockerignore \
            packages/backend packages/shared ops/deploy_backend.sh ops/verify_backend.mjs ops/inspect_backend_host.sh

      - name: Upload and deploy using the pinned ED25519 host key
        env:
          DEPLOY_SERVER_HOST: ${{ secrets.DEPLOY_SERVER_HOST }}
          DEPLOY_SERVER_USERNAME: ${{ secrets.DEPLOY_SERVER_USERNAME }}
          DEPLOY_SERVER_PASSWORD: ${{ secrets.DEPLOY_SERVER_PASSWORD }}
        run: bash ops/release_backend.sh
