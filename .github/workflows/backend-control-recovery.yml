name: Docker control recovery

on:
  workflow_dispatch:
    inputs:
      action:
        type: choice
        options: [plan, enable-live-restore, restart-controller]
        default: plan
        required: true
        description: Plan first; restart only with verified live restore and business-process continuity

permissions:
  contents: read

jobs:
  recover:
    if: >-
      github.repository == 'wiperi/qrent' &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/staging')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: ${{ github.ref == 'refs/heads/main' && 'production' || 'staging' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Inspect or recover only the Docker control plane with live restore
        env:
          DEPLOY_SERVER_HOST: ${{ secrets.DEPLOY_SERVER_HOST }}
          DEPLOY_SERVER_USERNAME: ${{ secrets.DEPLOY_SERVER_USERNAME }}
          DEPLOY_SERVER_PASSWORD: ${{ secrets.DEPLOY_SERVER_PASSWORD }}
          QRENT_CONTROL_ACTION: ${{ inputs.action }}
        run: bash ops/release_backend.sh control
