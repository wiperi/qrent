name: Security Scanning

on:
  push:
    branches: [ main, staging, develop ]
  pull_request:
    branches: [ main, staging ]
  schedule:
    # Run security scan daily at 2 AM UTC
    - cron: '0 2 * * *'

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Dependency vulnerability scanning
  dependency-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 8

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run pnpm audit
        run: |
          echo "🔍 Running pnpm audit..."
          pnpm audit --audit-level moderate --json > audit-results.json || true
          
          # Check if there are high/critical vulnerabilities
          HIGH_VULNS=$(cat audit-results.json | jq '.vulnerabilities | to_entries | map(select(.value.severity == "high" or .value.severity == "critical")) | length' 2>/dev/null || echo "0")
          
          if [ "$HIGH_VULNS" -gt 0 ]; then
            echo "❌ Found $HIGH_VULNS high/critical vulnerabilities"
            pnpm audit --audit-level moderate
            exit 1
          else
            echo "✅ No high/critical vulnerabilities found"
          fi

      - name: Upload audit results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audit-results
          path: audit-results.json

  # Secret scanning
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for better secret detection

      - name: Run TruffleHog OSS
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: main
          head: HEAD
          extra_args: --debug --only-verified

  # Static Application Security Testing (SAST)
  sast-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Semgrep
        uses: semgrep/semgrep-action@v1
        with:
          config: >- # Use multiple rulesets
            p/security-audit
            p/secrets
            p/nodejs
            p/typescript
            p/docker
        env:
          SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}

  # Docker security scanning
  docker-scan:
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image for scanning
        run: |
          docker build -f packages/backend/Dockerfile -t qrent-backend-scan:latest .

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: qrent-backend-scan:latest
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH,MEDIUM'

      - name: Upload Trivy scan results
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'

      - name: Check for critical vulnerabilities
        run: |
          # Convert SARIF to simple text for analysis
          CRITICAL_COUNT=$(cat trivy-results.sarif | jq '[.runs[].results[] | select(.level == "error")] | length' 2>/dev/null || echo "0")
          HIGH_COUNT=$(cat trivy-results.sarif | jq '[.runs[].results[] | select(.level == "warning")] | length' 2>/dev/null || echo "0")
          
          echo "Critical vulnerabilities: $CRITICAL_COUNT"
          echo "High vulnerabilities: $HIGH_COUNT"
          
          if [ "$CRITICAL_COUNT" -gt 0 ]; then
            echo "❌ Critical vulnerabilities found in Docker image"
            exit 1
          elif [ "$HIGH_COUNT" -gt 5 ]; then
            echo "⚠️ Warning: Many high-severity vulnerabilities found ($HIGH_COUNT)"
            # Don't fail build, but warn
          fi

  # License compliance check
  license-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 8

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install license checker
        run: npm install -g license-checker

      - name: Check licenses
        run: |
          echo "🔍 Checking package licenses..."
          
          # Define forbidden licenses
          FORBIDDEN_LICENSES="GPL-2.0,GPL-3.0,AGPL-1.0,AGPL-3.0"
          
          # Check for forbidden licenses
          if license-checker --onlyAllow "MIT;BSD;Apache-2.0;ISC;Unlicense;CC0-1.0;BSD-2-Clause;BSD-3-Clause;Apache-1.1;Apache-1.0" --excludePackages "$(pwd)" > license-report.txt 2>&1; then
            echo "✅ All package licenses are compliant"
          else
            echo "❌ Found packages with non-compliant licenses:"
            cat license-report.txt
            exit 1
          fi

      - name: Upload license report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: license-report
          path: license-report.txt

  # Security summary
  security-summary:
    runs-on: ubuntu-latest
    needs: [dependency-scan, secret-scan, sast-scan, docker-scan, license-check]
    if: always()
    steps:
      - name: Security scan summary
        run: |
          echo "## 🛡️ Security Scan Summary"
          echo "| Check | Status |"
          echo "|-------|--------|"
          echo "| Dependency Scan | ${{ needs.dependency-scan.result == 'success' && '✅ Pass' || '❌ Fail' }} |"
          echo "| Secret Scan | ${{ needs.secret-scan.result == 'success' && '✅ Pass' || '❌ Fail' }} |"
          echo "| SAST Scan | ${{ needs.sast-scan.result == 'success' && '✅ Pass' || '❌ Fail' }} |"
          echo "| Docker Scan | ${{ needs.docker-scan.result == 'success' && '✅ Pass' || (needs.docker-scan.result == 'skipped' && '⏭️ Skip' || '❌ Fail') }} |"
          echo "| License Check | ${{ needs.license-check.result == 'success' && '✅ Pass' || '❌ Fail' }} |"
          
          # Fail if any critical security checks failed
          if [[ "${{ needs.dependency-scan.result }}" == "failure" || 
                "${{ needs.secret-scan.result }}" == "failure" || 
                "${{ needs.sast-scan.result }}" == "failure" ]]; then
            echo "❌ Critical security issues detected!"
            exit 1
          else
            echo "✅ Security scans completed successfully"
          fi