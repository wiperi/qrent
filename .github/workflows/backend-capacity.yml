name: Backend capacity recovery

on:
  workflow_dispatch:
    inputs:
      action:
        type: choice
        options: [plan, apply]
        default: plan
        required: true
        description: Plan first; apply only named caches and bounded tmpfs headroom

permissions:
  contents: read

jobs:
  recover:
    if: >-
      github.repository == 'wiperi/qrent' &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/staging')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: ${{ github.ref == 'refs/heads/main' && 'production' || 'staging' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Recover cache capacity while preserving existing services
        env:
          DEPLOY_SERVER_HOST: ${{ secrets.DEPLOY_SERVER_HOST }}
          DEPLOY_SERVER_USERNAME: ${{ secrets.DEPLOY_SERVER_USERNAME }}
          DEPLOY_SERVER_PASSWORD: ${{ secrets.DEPLOY_SERVER_PASSWORD }}
          QRENT_CAPACITY_ACTION: ${{ inputs.action }}
        run: bash ops/release_backend.sh capacity
