name: CI

on:
  push:
    branches: [ main, staging, develop ]
  pull_request:
    branches: [ main, staging ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Detect changes to optimize which jobs run
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.changes.outputs.backend }}
      frontend: ${{ steps.changes.outputs.frontend }}
      shared: ${{ steps.changes.outputs.shared }}
      workflows: ${{ steps.changes.outputs.workflows }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: changes
        with:
          filters: |
            backend:
              - 'packages/backend/**'
              - 'packages/shared/**'
              - 'ops/*backend*'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - '.dockerignore'
            frontend:
              - 'packages/frontend/**'
              - 'packages/shared/**'
            shared:
              - 'packages/shared/**'
            workflows:
              - '.github/workflows/**'

  # Lint and format check
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run ESLint
        run: echo "skipping pnpm lint"

      - name: Check Prettier formatting
        run: pnpm style

  # Build all packages
  build:
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter shared db:generate

      - name: Build backend
        run: pnpm --filter backend build

      - name: Build frontend
        run: pnpm --filter frontend build

      - name: Cache build artifacts
        uses: actions/cache@v4
        with:
          path: |
            packages/*/dist
            packages/frontend/.next
          key: ${{ runner.os }}-build-${{ github.sha }}

  # Isolated tests: no production database, model, transit or email requests.
  test-backend:
    runs-on: ubuntu-latest
    needs: [changes, lint]
    if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.shared == 'true' || needs.changes.outputs.workflows == 'true'
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Generate client without connecting to a database
        env:
          DATABASE_URL: mysql://build:build@127.0.0.1:3306/qrent
        run: pnpm --filter @qrent/shared db:generate
      - name: Backend search and startup regressions
        run: pnpm --filter @qrent/backend exec jest --runInBand --runTestsByPath tests/LegacySearchOrder.test.ts tests/StartupDoesNotMigrate.test.ts
      - name: Backend deployment and health checks
        run: |
          bash -n ops/deploy_backend.sh
          bash -n ops/release_backend.sh
          bash -n ops/inspect_backend_host.sh
          python3 -m unittest discover -s ops -p test_deploy_backend.py
          python3 -m unittest discover -s ops -p test_release_backend.py
          node --test ops/test_verify_backend.mjs
      - name: Build the backend release image
        run: docker build -t qrent-backend:ci -f packages/backend/Dockerfile .
      - name: Check the generated Prisma client without network access
        run: >-
          docker run --rm --network none --entrypoint node
          -e DATABASE_URL=mysql://build:build@127.0.0.1:3306/qrent
          qrent-backend:ci
          -e "require(require.resolve('@prisma/client', {paths:['/app/packages/shared']}))"

  # Test frontend (stub - tests not implemented yet) 
  test-frontend:
    runs-on: ubuntu-latest
    needs: [changes, lint]
    if: needs.changes.outputs.frontend == 'true' || needs.changes.outputs.shared == 'true'
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Frontend tests placeholder
        run: |
          echo "🚧 Frontend tests not implemented yet"
          echo "TODO: Add Vitest tests for frontend package"
          echo "Expected test commands:"
          echo "  - pnpm --filter frontend test:unit"
          echo "  - pnpm --filter frontend test:integration"

  # Type checking
  typecheck:
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter shared db:generate

      - name: Type check backend
        run: pnpm --filter backend build

      - name: Type check frontend
        run: pnpm --filter frontend exec tsc --noEmit

  # Final check - all tests passed
  ci-success:
    runs-on: ubuntu-latest
    needs: [build, test-backend, test-frontend, typecheck]
    if: always()
    steps:
      - name: Check if all jobs succeeded
        run: |
          if [[ "${{ needs.build.result }}" == "success" && 
                ("${{ needs.test-backend.result }}" == "success" || "${{ needs.test-backend.result }}" == "skipped") && 
                ("${{ needs.test-frontend.result }}" == "success" || "${{ needs.test-frontend.result }}" == "skipped") && 
                "${{ needs.typecheck.result }}" == "success" ]]; then
            echo "✅ All CI checks passed!"
            exit 0
          else
            echo "❌ Some CI checks failed"
            exit 1
          fi

  deploy:
    needs: [ci-success, changes]
    if: >-
      !cancelled() && needs.ci-success.result == 'success' && needs.changes.result == 'success' &&
      github.event_name == 'push' && github.repository == 'wiperi/qrent' &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/staging') &&
      (needs.changes.outputs.backend == 'true' || needs.changes.outputs.shared == 'true' || needs.changes.outputs.workflows == 'true')
    uses: ./.github/workflows/cd.yml
    secrets: inherit
