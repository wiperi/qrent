name: Scraper Recovery Probe

on:
  push:
    branches: [fix/scraper-recovery-20261027]
    paths: [.github/workflows/scraper-recovery-probe.yml]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 3
    steps:
      - name: Probe existing server credentials with pinned host key
        env:
          QRENT_SSH_HOST: ${{ secrets.QRENT_RECOVERY_HOST }}
          QRENT_SSH_USER: root
          QRENT_SSH_KEY: ${{ secrets.SCRAPER_SERVER_SSH_KEY }}
          QRENT_SSH_KNOWN_HOSTS: ${{ secrets.QRENT_RECOVERY_KNOWN_HOSTS }}
        run: |
          python3 - <<'PY'
          import json, os, pathlib, subprocess, sys, tempfile
          host = os.environ['QRENT_SSH_HOST'].strip()
          user = os.environ['QRENT_SSH_USER'].strip()
          assert host and user and os.environ['QRENT_SSH_KNOWN_HOSTS']
          remote = '''import hashlib,json,pathlib,subprocess
          root=pathlib.Path('/root/qrent-scraper')
          release=root/'releases/recovery-20261027'
          result={'target_release_present':release.is_dir()}
          if release.is_dir():
              result['cron_active']=subprocess.run(['systemctl','is-active','--quiet','crond']).returncode==0
              result['has_egress_module']=(release/'src/utils/egress.py').exists()
              result['network_sha256']=hashlib.sha256((release/'src/utils/network.py').read_bytes()).hexdigest()
              result['capture_pids']=[]
              for entry in pathlib.Path('/proc').iterdir():
                  if not entry.name.isdigit(): continue
                  try:
                      if b'recovery_runner.py' in (entry/'cmdline').read_bytes():
                          result['capture_pids'].append(int(entry.name))
                  except OSError: pass
          print(json.dumps(result))
          raise SystemExit(0 if result['target_release_present'] else 2)
          '''
          with tempfile.TemporaryDirectory(prefix='qrent-probe-') as directory:
              folder=pathlib.Path(directory)
              known=folder/'known_hosts'
              pins=[]
              for line in os.environ['QRENT_SSH_KNOWN_HOSTS'].splitlines():
                  fields=line.split()
                  if fields and not line.startswith('#'):
                      pins.append(' '.join(['qrent-recovery-pin']+fields[1:3]))
              known.write_text('\n'.join(pins)+'\n'); known.chmod(0o600)
              identity=folder/'identity'
              identity.write_text(os.environ['QRENT_SSH_KEY'].rstrip()+'\n'); identity.chmod(0o600)
              env=dict(os.environ)
              command=['ssh','-T','-i',str(identity),'-o','BatchMode=yes','-o','IdentitiesOnly=yes','-o','StrictHostKeyChecking=yes','-o','HostKeyAlias=qrent-recovery-pin','-o',f'UserKnownHostsFile={known}',
                  '-o','GlobalKnownHostsFile=/dev/null','-o','IdentityAgent=none',
                  '-o','ConnectTimeout=10','-o','ServerAliveInterval=10','-o','ServerAliveCountMax=2',
                  f'{user}@{host}','python3.11','-']
              result=subprocess.run(command,input=remote,text=True,capture_output=True,timeout=90,env=env)
              print(result.stdout)
              if result.returncode: print(result.stderr)
              raise SystemExit(result.returncode)
          PY
