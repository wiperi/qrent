name: Little Q cloud replay

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  replay:
    if: github.repository == 'wiperi/qrent' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Replay synthetic user conversations against the production assistant
        env:
          QRENT_CLOUD_REPLAY_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: node packages/frontend/test/rental-assistant/cloud-replay.mjs
